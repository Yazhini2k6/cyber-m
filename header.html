<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Component</title>
    <style>
        /* --- CSS Variables (Matches Overview Page) --- */
        :root {
            --bg-color: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #737373;
            --border-color: #e5e5e5;
            --accent-color: #f36c21;
            --accent-hover: #d95a12;
            --header-height: 70px;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-primary: #eeeeee;
            --text-secondary: #a0a0a0;
            --border-color: #2a2a2a;
            --accent-color: #f36c21;
            --accent-hover: #ff823a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- Header Navigation Bar --- */
        .cyber-header {
            width: 100%;
            height: var(--header-height);
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background-color 0.3s, border-color 0.3s;
        }

        /* Logo Branding Area */
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 12px;
        }

        .logo-img {
            height: 38px;
            width: auto;
            object-fit: contain;
        }

        /* Pure CSS Logo Fallback (If image isn't loaded) */
        .logo-text-fallback {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .logo-main {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
        }

        .logo-m-box {
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 1px 6px;
            border-radius: 2px;
            margin-left: 2px;
            font-family: monospace;
        }

        .logo-sub {
            font-size: 0.55rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: var(--text-primary);
            text-transform: lowercase;
            margin-top: 2px;
        }

        .logo-sub span {
            color: var(--accent-color);
        }

        /* Navigation Links */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }

        .nav-item a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-item a:hover,
        .nav-item.active a {
            color: var(--text-primary);
        }

        /* Header Action Buttons */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background-color 0.2s;
        }

        .btn-theme-toggle:hover {
            background-color: var(--border-color);
        }

        .btn-login {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 12px;
        }

        .btn-get-started {
            text-decoration: none;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        [data-theme="dark"] .btn-get-started {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .btn-get-started:hover {
            opacity: 0.9;
        }

        /* Responsive Breakpoint */
        @media (max-width: 868px) {
            .cyber-header { padding: 0 20px; }
            .nav-links { display: none; } /* Add a hamburger menu script here if needed */
        }
    </style>
</head>
<body>

    <header class="cyber-header">
        
        <a href="#" class="logo-container">
            <img src="cyberM.png" alt="CyberM - Master Cybersecurity" class="logo-img" onerror="this.style.display='none'; document.getElementById('css-logo').style.display='flex';">
            
            <div id="css-logo" class="logo-text-fallback" style="display: none;">
                <div class="logo-main">cyber<span class="logo-m-box">M</span></div>
                <div class="logo-sub">master <span>cybersecurity</span></div>
            </div>
        </a>

        <ul class="nav-links">
            <li class="nav-item"><a href="#">Platform</a></li>
            <li class="nav-item active"><a href="#">Workspace</a></li>
            <li class="nav-item"><a href="#">AI Assistant</a></li>
            <li class="nav-item"><a href="#">Who's It For</a></li>
        </ul>

        <div class="header-actions">
            <button class="btn-theme-toggle" onclick="toggleHeaderTheme()">🌓 Theme</button>
            <a href="#" class="btn-login">Log in</a>
            <a href="#" class="btn-get-started">Get Started ↗</a>
        </div>

    </header>
    <script>
        function toggleHeaderTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
            } else {
                body.setAttribute('data-theme', 'dark');
            }
        }
    </script>
</body>
</html>
